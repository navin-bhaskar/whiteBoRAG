# Copy to config.toml (git-ignored) and edit. Model names are OpenRouter ids
# (run `uv run python -m whiteborag_openrouter.smoke` to check them). The key is read from
# the environment variable named by api_key_env, or from that line in the repo-root .env.

llm_base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
host = "0.0.0.0"   # reachable from the ESP32 on the LAN
port = 8080
max_tokens = 1500
data_dir = "data"  # relative to openrouter/

[models]
check = "amazon/nova-pro-v1"
transcribe = "anthropic/claude-sonnet-5.5"   # eval/RESULTS.md: best reader
transcribe_mode = "raw"   # raw | hybrid-text | hybrid-vision
ocr = ""                  # the OCR model for a hybrid transcribe
ocr_prompt = ""           # that model's own plain-OCR prompt
text = "anthropic/claude-haiku-5.5"         # normalize (spelling + project pick) + chat
embed = "amazon/titan-embed-text-v2"
project_pick = "model"   # model: the model picks, as on AWS (a "Name: rest" title still wins); title: fuzzy-match only

# Device key (sent as X-Device-Key) -> device id used in capture keys.
[devices]
"change-me-device-key" = "cam-01"
