[project]
name = "harness"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = ["boto3", "opencv-python-headless", "numpy", "rapidfuzz"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
